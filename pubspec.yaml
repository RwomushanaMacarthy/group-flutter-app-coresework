name: agrilink
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # Local persistence
  shared_preferences: ^2.2.3

  # Icons
  cupertino_icons: ^1.0.8

  # Splash screen slider dots
  smooth_page_indicator: ^1.2.0

  # Image loading from internet + local files
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/bana.png
    - assets/toma.png
    - assets/ono.png