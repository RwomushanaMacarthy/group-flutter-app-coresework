name: agrilink
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # Local persistence
  shared_preferences: ^2.2.3

  # Icons
  cupertino_icons: ^2.0.0

  # Splash screen slider dots
  smooth_page_indicator: ^3.0.0

  # ── NEW: image loading from internet + local files ──
  cached_network_image: ^4.0.6   # loads & caches product images from URLs
  image_picker: ^1.1.2           # camera + gallery picker (works offline)
  file_picker: ^13.3.2            # browse device files for images

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/mm.png
    - assets/toma.png
    - assets/ono.png
    - assets/logo.png
    - assets/bana.png