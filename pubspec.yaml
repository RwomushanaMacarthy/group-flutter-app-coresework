name: agrilink
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # Local persistence
  shared_preferences: ^2.2.3

  # Icons
  cupertino_icons: ^1.0.8

  # Splash screen slider dots
  smooth_page_indicator: ^1.2.0

  # Image loading from internet + local files
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # ADD THIS LINE
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/bana.png
    - assets/toma.png
    - assets/ono.png

# ADD THIS BLOCK AT THE VERY BOTTOM
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_background: "#FFFFFF" # You can change this color if you want a different background
  adaptive_icon_foreground: "assets/logo.png"